name: Verify (Cloud)

# 云端自动化校验：单元测试（每次 push）+ 线上端到端校验（部署完成后 / 定时巡检 / 手动）。
# 本地无需任何环境，所有验证都在 GitHub Actions 上跑。
on:
  push:
    branches: [master]
  # 部署工作流结束后立即做一次线上校验（push 时部署还没生效，因此 e2e 靠这个触发）
  workflow_run:
    workflows: ["Deploy to Cloudflare Workers"]
    types: [completed]
  # 定时巡检：线上被改坏（脚本语法损坏 / 按钮点不动）能及时发现
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

concurrency:
  group: verify
  cancel-in-progress: true

jobs:
  # 1) 单元测试：重写规则 + 首页伪装 + 节点国家标注。三者都不需要网络，每次 push 都跑。
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 重写规则校验
        run: node tools/check-rewrite.mjs
      # 首页伪装：重点守住「启用后管理员把自己锁在面板外」与「伪装页反而泄漏身份」两类回归
      - name: 首页伪装校验
        run: node tools/check-disguise.mjs
      # 节点国家标注：守住「订阅被改坏」（编码形态 / 中文乱码）与「数据源挂了拖垮订阅」
      - name: 节点标注校验
        run: node tools/check-nodetag.mjs
      # CDN 任播兜底：守住「GeoIP 查不到就编一个国名」，以及拿不到官方段时不能拖垮订阅
      - name: 任播兜底校验
        run: node tools/check-anycast.mjs
      # 主题系统：守住「10 套预设都在」「自定义主题能存能删」，以及最要紧的一条——
      # 自定义主题的内容会被拼进 <style>，不能被写穿成 CSS 注入
      - name: 主题系统校验
        run: node tools/check-themes.mjs
      # 出口压缩 + 上游请求策略：压缩错了会让浏览器解不开整站资源，必须验证「压完能还原」
      - name: 出口压缩校验
        run: node tools/check-compress.mjs
      # 代理链路冒烟：从路由入口走到页面出口。单测各自通过、组合起来却炸的问题
      # （参数没顺着调用链传下去）只有跑通整条路才抓得住
      - name: 代理链路冒烟
        run: node tools/check-smoke.mjs
      # 访问统计与驾驶舱：从 worker 入口真发请求，验证「采集真的接上了」——
      # record() 曾经写好了却没有任何调用方，接口永远返回空，而所有单测都是绿的
      - name: 访问统计与驾驶舱校验
        run: node tools/check-stats.mjs
      # 防护三件套：限流防滥用 / 告警通知 / 站点临时链接。
      # 这里最要紧的两条是「默认关闭时不能误伤正常用户」和「临时链接按次数/时长双重到期后必须失效」
      - name: 防护三件套校验
        run: node tools/check-guard.mjs
      # 配置页与接口目录：防的是「静默地对不上」——SPEC 加了字段而目录忘了加，
      # 界面上就少一个输入框，用户永远改不到那个配置，却不会有任何报错。
      # 同时守住「同一份配置全页只出现一次」：优选池曾经同时长在两个选项卡里。
      - name: 配置页与接口目录校验
        run: node tools/check-configui.mjs
      # 操作手册的速查表由目录生成。手抄的字段名与默认值必然过期，这里卡住不同步
      - name: 操作手册与代码同步校验
        run: node tools/gen-manual.mjs

  # 2) 线上端到端校验：真实浏览器渲染 + 点击，覆盖「页面能打开但按钮点不动」这类只有跑起来才暴露的问题
  e2e:
    needs: unit
    # push 触发时部署尚未生效，交给 workflow_run 触发的这次来验
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 安装浏览器
        run: npm i puppeteer@23 --no-audit --no-fund 2>&1 | tail -3
      - name: 等待部署生效
        run: sleep 40
      - name: 线上校验
        env:
          # 必须显式配置：PR 无关地把校验打到别人的域名上会让结果失真
          PROXY_HOST: ${{ vars.PROXY_HOST }}
        run: node tools/check-e2e.mjs
