name: Verify (Cloud)

# 云端自动化校验：单元测试（每次 push）+ 线上端到端校验（部署完成后 / 定时巡检 / 手动）。
# 本地无需任何环境，所有验证都在 GitHub Actions 上跑。
on:
  push:
    branches: [master]
  # 部署工作流结束后立即做一次线上校验（push 时部署还没生效，因此 e2e 靠这个触发）
  workflow_run:
    workflows: ["Deploy to Cloudflare Workers"]
    types: [completed]
  # 定时巡检：线上被改坏（脚本语法损坏 / 按钮点不动）能及时发现
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

concurrency:
  group: verify
  cancel-in-progress: true

jobs:
  # 1) 单元测试：重写规则 + 首页伪装 + 节点国家标注。三者都不需要网络，每次 push 都跑。
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 重写规则校验
        run: node tools/check-rewrite.mjs
      # 首页伪装：重点守住「启用后管理员把自己锁在面板外」与「伪装页反而泄漏身份」两类回归
      - name: 首页伪装校验
        run: node tools/check-disguise.mjs
      # 节点国家标注：守住「订阅被改坏」（编码形态 / 中文乱码）与「数据源挂了拖垮订阅」
      - name: 节点标注校验
        run: node tools/check-nodetag.mjs
      # CDN 任播兜底：守住「GeoIP 查不到就编一个国名」，以及拿不到官方段时不能拖垮订阅
      - name: 任播兜底校验
        run: node tools/check-anycast.mjs
      # 主题系统：守住「10 套预设都在」「自定义主题能存能删」，以及最要紧的一条——
      # 自定义主题的内容会被拼进 <style>，不能被写穿成 CSS 注入
      - name: 主题系统校验
        run: node tools/check-themes.mjs
      # 出口压缩 + 上游请求策略：压缩错了会让浏览器解不开整站资源，必须验证「压完能还原」
      - name: 出口压缩校验
        run: node tools/check-compress.mjs
      # HLS 播放清单：守住「清单被当成非文本直传、不做 URL 改写」这个回归。
      # 清单里的分片地址与 AES-128 密钥 URI 一旦原样透出，播放器按根路径去取就是 404 /
      # 解密失败，表现是视频完全播不了，而 HTML/JS/CSS 的所有单测都是绿的 —— 只有这里能抓住。
      - name: HLS 清单改写校验
        run: node tools/check-hls.mjs
      # 媒体 / 大文件链路：守住两处「优化做反了方向」—— 视频被整碗读进内存写 Cache API
      # （流量暴涨 + 极慢 + 播不了），以及 Range 分片被重试/对冲（每个分片下两遍）
      - name: 媒体与大文件链路校验
        run: node tools/check-media.mjs
      # 路径归一化：守住 /p/<id>//xxx 这类双斜杠。客户端把带尾斜杠的 base 地址与绝对值
      # 路径拼接就会产生它，源站与代理都当不同路径回 404 —— 症状是「能登录、能刷首页、
      # 就是播不了」，从表象极难反推，必须钉死
      - name: 反代路径归一化校验
        run: node tools/check-path.mjs
      # 前缀丢失自愈：客户端用绝对路径拼代理地址时 /p/<id> 会被 URL 规范吃掉，
      # 请求落到代理根上 404（Emby 的 DirectStreamUrl 就是这种形态）。这里同时钉住
      # 「该救的救到」与「不该碰的一律不碰」两个方向
      - name: 前缀丢失自愈校验
        run: node tools/check-heal.mjs
      # 代理链路冒烟：从路由入口走到页面出口。单测各自通过、组合起来却炸的问题
      # （参数没顺着调用链传下去）只有跑通整条路才抓得住
      - name: 代理链路冒烟
        run: node tools/check-smoke.mjs
      # 访问统计与驾驶舱：从 worker 入口真发请求，验证「采集真的接上了」——
      # record() 曾经写好了却没有任何调用方，接口永远返回空，而所有单测都是绿的
      - name: 访问统计与驾驶舱校验
        run: node tools/check-stats.mjs
      # 防护三件套：限流防滥用 / 告警通知 / 站点临时链接。
      # 这里最要紧的两条是「默认关闭时不能误伤正常用户」和「临时链接按次数/时长双重到期后必须失效」
      - name: 防护三件套校验
        run: node tools/check-guard.mjs
      # 配置页与接口目录：防的是「静默地对不上」——SPEC 加了字段而目录忘了加，
      # 界面上就少一个输入框，用户永远改不到那个配置，却不会有任何报错。
      # 同时守住「同一份配置全页只出现一次」：优选池曾经同时长在两个选项卡里。
      - name: 配置页与接口目录校验
        run: node tools/check-configui.mjs
      # 配置单一真源：防的不是「写死一个常量」，而是「同一个设定被写了两份、两份还不一致」——
      # 这类 bug 每份实现自己都是「对」的，单测全绿，只有把「面板行为」与「静态残留」一起钉才防得住。
      # 已真实发生过：IPv4 校验宽松版放行 999.999.999.999（面板说已保存、运行时静默丢弃）、
      # 优选频率两处各写一份、布尔词表两套词汇。
      - name: 配置单一真源校验
        run: node tools/check-single-source.mjs
      # 运行参数注册表：防的是「参数只在环境变量里能改」——面板上根本没有入口，
      # 用户以为改不到、只能重部署。这里端到端真跑一遍：渲染出的表单能改、保存后
      # 立即生效（无需重部署）、密钥回显脱敏、清空能回到默认。已真实发生过：
      # SUB_STRICT / PROXY_HEDGE_MS / CF_API_TOKEN 等 20+ 项此前只能靠环境变量。
      - name: 运行参数统一配置校验
        run: node tools/check-settings.mjs
      # 延迟实测：防的是「测出来的顺序根本不是按快慢排的」——探测能通、接口返回 200、
      # 统计数字也都有，唯独顺序不对，于是优选选出来的还是随机那一个。另外钉住两条：
      # 单次抖动不能误杀（误杀代价是少一个可用节点）、伪装下 404 必须算通。
      # 排序用例刻意用串行：并发下快的先完成，顺序天然就对，测不出去掉 .sort() 的情况。
      - name: 节点延迟实测校验
        run: node tools/check-latency.mjs
      # 部署形态：wrangler.toml 里的资源 ID 是占位符，靠 prepare-deploy.py 渲染。
      # 防两件事 ——「fork 之后部署失败且看不出为什么」（写死别人账号的资源 ID），
      # 以及「脚本漏了一行替换」（静态比对照样绿，所以这里真的把脚本跑起来验产物）。
      - name: 部署配置渲染校验
        run: node tools/check-wrangler.mjs
      # 操作手册的速查表由目录生成。手抄的字段名与默认值必然过期，这里卡住不同步
      - name: 操作手册与代码同步校验
        run: node tools/gen-manual.mjs

  # 2) 线上端到端校验：真实浏览器渲染 + 点击，覆盖「页面能打开但按钮点不动」这类只有跑起来才暴露的问题
  e2e:
    needs: unit
    # push 触发时部署尚未生效，交给 workflow_run 触发的这次来验
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 安装浏览器
        run: npm i puppeteer@23 --no-audit --no-fund 2>&1 | tail -3
      - name: 等待部署生效
        run: sleep 40
      - name: 线上校验
        env:
          # 必须显式配置：PR 无关地把校验打到别人的域名上会让结果失真
          PROXY_HOST: ${{ vars.PROXY_HOST }}
        run: node tools/check-e2e.mjs
