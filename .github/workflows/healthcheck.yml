name: Health Check & Auto Repair

# 定时健康检查：runner 从外部网络真实访问 PROXY_HOST（仓库变量，必填），
# 若 A 记录中的 IP 出现 1034（Edge IP Restricted）/不可达，自动扫描 CF 泛播候选、
# 重写「已验证可用集」(GOOD_IPS) 与 A 记录，实现自动自愈。
# 优选池的读写一律经 Worker 公开 API（/__api/pool-config、/__api/preferred-ips），
# 存储后端（KV / D1）由 Worker 侧 STORAGE_BACKEND 统一决定，健康检查不依赖 KV Namespace。
on:
  schedule:
    # 每 12 小时第 17 分钟触发（UTC）；也可在 Actions 页手动触发（workflow_dispatch）
    - cron: '17 */12 * * *'
  workflow_dispatch:   # 支持手动触发

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Health check & auto repair
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          # 写回 GOOD_IPS 需经 Worker 登录（管理口令），存储后端无关
          PASSWORD: ${{ secrets.PASSWORD }}
          # 候选域名池（改 DNS 用的域名）可在 GitHub 仓库 Settings→Secrets and variables→Actions→Variables 配置 PREF_DOMAINS
          PREF_DOMAINS_VAR: ${{ vars.PREF_DOMAINS }}
          # 反代域名（健康检查验证/修复的目标）：仓库变量 PROXY_HOST，必填，无默认值
          PROXY_HOST: ${{ vars.PROXY_HOST }}
        run: |
          set -e
          # 目标域名与 Zone 必须由仓库变量 / Secrets 显式给出：不再内置任何兜底值，
          # 避免健康检查在配置缺失时悄悄去改别人的 DNS。
          if [ -z "$PROXY_HOST" ]; then
            echo "::error::未配置仓库变量 PROXY_HOST（健康检查/自愈的目标域名），请在 Settings→Secrets and variables→Actions→Variables 中设置"
            exit 1
          fi
          if [ -z "$CF_ZONE_ID" ]; then
            echo "::error::未配置 Secret CF_ZONE_ID（目标域名所在 Zone 的 ID）"
            exit 1
          fi
          ZONE="$CF_ZONE_ID"
          HOST="$PROXY_HOST"
          echo "健康检查域名: $HOST"
          AUTH="Authorization: Bearer $CF_API_TOKEN"
          BASE="https://api.cloudflare.com/client/v4"

          # ---- 1) 读取当前 A 记录 ----
          echo "== 当前 A 记录 =="
          IPS=$(curl -s -m 15 -H "$AUTH" "$BASE/zones/$ZONE/dns_records?name=$HOST&type=A" \
            | python3 -c "import sys,json;[print(r['content']) for r in json.load(sys.stdin).get('result',[])]")
          echo "$IPS"
          # 读不到记录时不能当成「健康」：后面逐个验证的循环会一次都不跑，
          # 于是 Token 失效 / Zone 填错会伪装成「一切正常」，自愈彻底失效。
          if [ -z "$IPS" ]; then
            echo "::error::未读到任何 A 记录：请检查 CF_API_TOKEN 是否有效、CF_ZONE_ID 是否对应 $HOST 所在的 Zone"
            exit 1
          fi

          # ---- 2) 登录拿会话（后续所有 Worker API 都要用）----
          # 首页伪装开启后，全部 /__api/* 都要求登录 —— 这是刻意的安全收敛，
          # 健康检查也因此必须先换 cookie。管理口令本来就是本工作流的 Secret。
          # 关键点：此刻 DNS 可能已经指向故障 IP，所以按每条 A 记录逐个尝试建连，
          # 任一条通了就拿到会话；全都通不了时才退回系统解析（最后兜底）。
          COOKIE=""
          if [ -n "$PASSWORD" ]; then
            for tip in $IPS ""; do
              if [ -n "$tip" ]; then
                C=$(curl -s -m 10 -c - --resolve "$HOST:443:$tip" -X POST -H "Content-Type: application/json" \
                     -d "{\"password\":\"$PASSWORD\"}" "https://$HOST/__api/login" 2>/dev/null)
              else
                C=$(curl -s -m 10 -c - -X POST -H "Content-Type: application/json" \
                     -d "{\"password\":\"$PASSWORD\"}" "https://$HOST/__api/login" 2>/dev/null)
              fi
              C=$(echo "$C" | grep ap_auth | awk '{print $6"="$7}')
              if [ -n "$C" ]; then COOKIE="$C"; break; fi
            done
          fi
          if [ -z "$COOKIE" ]; then
            echo "::warning::无法登录 Worker（口令未配置或全部 A 记录不可达），候选池可能读不到内容"
          fi
          # 带会话的 GET（没会话时退化成匿名请求，行为与改造前一致）
          apiget() { if [ -n "$COOKIE" ]; then curl -s -m 15 -H "Cookie: $COOKIE" "$1"; else curl -s -m 15 "$1"; fi; }

          # ---- 2.5) 先按当前测速结果重算「慢节点」名单 ----
          # 判据只用浏览器测速的数字（服务端探测的快慢与用户网络无关，用它淘汰会误杀最快的节点）。
          # 算不出来（没测过 / 已过期 / 开关关闭）时 Worker 会清空名单，这里照常往下走。
          if [ -n "$COOKIE" ]; then
            curl -s -m 15 -X POST -H "Content-Type: application/json" -H "Cookie: $COOKIE" \
              -d '{}' "https://$HOST/__api/pool-slow" -o /dev/null || true
          fi

          # ---- 3) 逐个真实验证（curl --resolve = SNI=域名，能暴露 1034）----
          # 探活目标用根路径而非 /__api/config：伪装开启后后者要求登录，
          # 而这里要验证的是「这个 IP 能不能正常服务」，任何 2xx/3xx 都是活的。
          # 根路径也是所有网站都有的路径，不会额外增加指纹。
          BAD=""
          while IFS= read -r ip; do
            [ -z "$ip" ] && continue
            code=$(curl -s -m 8 --resolve "$HOST:443:$ip" -o /dev/null -w "%{http_code}" "https://$HOST/" || echo 000)
            echo "  $ip -> $code"
            case "$code" in
              2??|3??) ;;
              *) BAD=1 ;;
            esac
          done <<< "$IPS"

          if [ -z "$BAD" ]; then
            echo "✅ 健康：所有 A 记录均可正常服务，无需处理"
            exit 0
          fi
          echo "⚠️ 检测到异常 IP（1034/不可达），开始自动修复…"

          # ---- 2) 候选从「优选 IP 池」获取：经 Worker 公开 API 读取（GOOD_IPS / PREF_IPS / PREF_DOMAINS），
          #      存储后端由 Worker 侧统一选择，不再直连 KV Namespace ----
          TS=$(date +%s)
          POOL=$(apiget "https://$HOST/__api/pool-config?t=$TS" || true)
          GOOD_API=$(echo "$POOL" | python3 -c "import sys,json;d=json.load(sys.stdin);print(' '.join(d.get('pool_good_ips',[])))" 2>/dev/null || true)
          DOMAINS_API=$(echo "$POOL" | python3 -c "import sys,json;d=json.load(sys.stdin);print(' '.join(d.get('pref_domains',[])))" 2>/dev/null || true)
          ADD_API=$(apiget "https://$HOST/__api/preferred-ips?t=$TS" | python3 -c "import sys,json;d=json.load(sys.stdin);print(' '.join(d.get('preferred_ips',[])))" 2>/dev/null || true)
          # 候选来源（均可配置，无写死）：订阅链接（Worker 侧已按 IP 归属过滤）+ 已验证可用集 + 优选池
          SUB_API=$(apiget "https://$HOST/__api/preferred-candidates?t=$TS" | python3 -c "import sys,json;d=json.load(sys.stdin);print(' '.join(d.get('ips',[])))" 2>/dev/null || true)
          CAND=$(echo "$GOOD_API $ADD_API $SUB_API" | tr ' ' '\n' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' | sort -u | tr ' ' '\n')
          echo "优选 IP 池候选: $(echo $CAND | wc -w) 个（其中订阅候选 $(echo $SUB_API | wc -w) 个）"
          # 慢节点不进候选：自愈的目的是换到更好的，换回一个「通但很慢」的节点等于没修
          SLOW_API=$(apiget "https://$HOST/__api/pool-slow?t=$TS" | python3 -c "import sys,json;d=json.load(sys.stdin);print(' '.join(d.get('ips',[])))" 2>/dev/null || true)
          if [ -n "$SLOW_API" ]; then
            printf '%s\n' $SLOW_API | sort -u > /tmp/slow_ips.txt
            CAND=$(echo "$CAND" | tr ' ' '\n' | grep -vxF -f /tmp/slow_ips.txt | tr ' ' '\n')
            echo "已剔除慢节点: $(wc -l < /tmp/slow_ips.txt) 个，剩余候选: $(echo $CAND | wc -w) 个"
          fi
          # 池不足时兜底：解析候选域名池得到动态 IP（不写死 IP 列表）。
          # 配置优先级：GitHub 仓库变量 PREF_DOMAINS（Settings→Variables）→ Worker 侧 PREF_DOMAINS（面板可配）
          if [ "$(echo $CAND | wc -w)" -lt 5 ]; then
            PREF_DOMAINS="$PREF_DOMAINS_VAR"
            if [ -z "$PREF_DOMAINS" ]; then
              PREF_DOMAINS="$DOMAINS_API"
            fi
            for d in $PREF_DOMAINS; do
              CAND="$CAND $(getent ahostsv4 "$d" 2>/dev/null | awk '{print $1}' | sort -u)"
            done
            CAND=$(echo "$CAND" | tr ' ' '\n' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' | sort -u | tr ' ' '\n')
            echo "域名解析兜底后候选: $(echo $CAND | wc -w) 个"
          fi
          if [ -z "$CAND" ]; then
            echo "::error::无任何可扫描候选：请在管理页粘贴订阅链接 / 保存优选池，或配置仓库变量 PREF_DOMAINS"
            exit 1
          fi
          GOOD=""
          for ip in $CAND; do
            (
              code=$(curl -s -m 6 --resolve "$HOST:443:$ip" -o /dev/null -w "%{http_code}" "https://$HOST/" || echo 000)
              case "$code" in
                2??|3??) echo "$ip" >> /tmp/good_ips.txt ;;
              esac
            ) &
            # 限制并发 10
            while [ "$(jobs -r | wc -l)" -ge 10 ]; do wait -n; done
          done
          wait
          if [ -f /tmp/good_ips.txt ]; then
            # 按**用户侧实测延迟**排序再取前 6 —— 原来是 sort -u（字典序），等于随机挑，
            # 自愈很可能换到一个「通、但对你很慢」的节点。没测过的垫后（未知 ≠ 慢）。
            # 顺序直接取 Worker 的 /__api/pick-speed（已按毫秒升序排好，判据只有那一份）。
            PICK_ORDER=$(apiget "https://$HOST/__api/pick-speed?t=$TS" | python3 -c "import sys,json;print(' '.join(i['ip'] for i in json.load(sys.stdin).get('items',[])))" 2>/dev/null || true)
            GOOD=$(sort -u /tmp/good_ips.txt | awk -v order="$PICK_ORDER" 'BEGIN{n=split(order,a," ");for(i=1;i<=n;i++) rank[a[i]]=i} {if($0 in rank) r=rank[$0]; else r=9999; print r "\t" $0}' | sort -n | cut -f2 | head -6)
          fi
          echo "扫描到可用 IP: ${GOOD:-无}"
          if [ -z "$GOOD" ]; then
            echo "❌ 未找到任何可用 IP，保留当前记录，请人工介入"
            exit 1
          fi

          # ---- 4) 重写已验证可用集 GOOD_IPS：经 Worker API 写入（后端 KV / D1 均一致）----
          # 会话在第 2 步已取得并按 A 记录轮询过，这里直接复用
          if [ -z "$COOKIE" ]; then
            echo "⚠️ 无法登录 Worker，GOOD_IPS 未写回（候选池将只依赖域名解析兜底）"
          else
            GOOD_BODY=$(python3 -c "import sys,json;print(json.dumps({'pool_good_ips': sys.stdin.read().split()}))" <<< "$GOOD")
            curl -s -m 15 -X POST -H "Content-Type: application/json" -H "Cookie: $COOKIE" \
              -d "$GOOD_BODY" "https://$HOST/__api/pool-config" -o /dev/null -w "GOOD_IPS 更新: %{http_code}\n"
          fi

          # ---- 5) 更新 A 记录（前 2 个可用 IP）----
          RECS=$(curl -s -m 15 -H "$AUTH" "$BASE/zones/$ZONE/dns_records?name=$HOST&type=A" \
            | python3 -c "import sys,json;[print(r['id']) for r in json.load(sys.stdin).get('result',[])]")
          NEW_IPS=$(echo "$GOOD" | tr ' ' '\n' | head -2)
          i=0
          for rid in $RECS; do
            newip=$(echo "$NEW_IPS" | sed -n "$((i+1))p")
            if [ -n "$newip" ]; then
              curl -s -m 15 -X PATCH -H "$AUTH" -H "Content-Type: application/json" \
                "$BASE/zones/$ZONE/dns_records/$rid" \
                -d "{\"content\":\"$newip\",\"name\":\"$HOST\",\"type\":\"A\",\"ttl\":300,\"proxied\":false}" \
                -o /dev/null -w "A 记录 $((i+1)) -> $newip: %{http_code}\n"
            fi
            i=$((i+1))
          done

          # ---- 6) 等 DNS 生效后复验 ----
          echo "等待 DNS 生效（10s）…"
          sleep 10
          OK=1
          for ip in $NEW_IPS; do
            code=$(curl -s -m 8 --resolve "$HOST:443:$ip" -o /dev/null -w "%{http_code}" "https://$HOST/" || echo 000)
            echo "  复验 $ip -> $code"
            case "$code" in
              2??|3??) ;;
              *) OK=0 ;;
            esac
          done
          if [ "$OK" = "1" ]; then
            echo "✅ 修复完成：A 记录已指向可用 IP"
          else
            echo "⚠️ 复验未完全通过，请关注后续检查"
          fi
