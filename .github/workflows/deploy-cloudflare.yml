name: Deploy to Cloudflare Workers

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: workers-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PASSWORD: ${{ secrets.PASSWORD }}
      UUID: ${{ secrets.UUID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ZONE_ID: ${{ secrets.CF_ZONE_ID || '3e768047adb7722044400a312bbe7a2e' }}
      # GitHub 仓库 Variables.STORAGE_BACKEND 可选 kv，默认 d1（D1 为默认后端，部署前自动应用迁移）
      STORAGE_BACKEND: ${{ vars.STORAGE_BACKEND || 'd1' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Worker to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "3.114.0"
          preCommands: |
            # 按 STORAGE_BACKEND 裁剪 wrangler.toml，只绑定实际使用的后端（避免未使用绑定的缺失/权限校验失败）：
            #   d1（默认）→ 保留 D1、先应用迁移建表，删除 KV 绑定
            #   kv        → 保留 KV，删除 D1 绑定
            if [ "$STORAGE_BACKEND" = "kv" ]; then
              python3 - <<'PY'
            import re
            p = 'wrangler.toml'
            s = open(p, encoding='utf-8').read()
            s = re.sub(r'\[\[d1_databases\]\].*?(?=\n\[\[|\n\[|\Z)', '', s, flags=re.S)
            open(p, 'w', encoding='utf-8').write(s)
            PY
            else
              npx wrangler d1 migrations apply any-proxy-db --remote
              python3 - <<'PY'
            import re
            p = 'wrangler.toml'
            s = open(p, encoding='utf-8').read()
            s = re.sub(r'\[\[kv_namespaces\]\].*?(?=\n\[\[|\n\[|\Z)', '', s, flags=re.S)
            open(p, 'w', encoding='utf-8').write(s)
            PY
            fi
          command: deploy --var STORAGE_BACKEND:$STORAGE_BACKEND
          postCommands: |
            echo "$PASSWORD" | npx wrangler secret put PASSWORD
            echo "$UUID" | npx wrangler secret put UUID
            echo "$CLOUDFLARE_API_TOKEN" | npx wrangler secret put CF_API_TOKEN
            echo "$CF_ZONE_ID" | npx wrangler secret put CF_ZONE_ID
