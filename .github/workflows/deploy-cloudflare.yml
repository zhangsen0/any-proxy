name: Deploy to Cloudflare Workers

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      skip_migrations:
        # 正常情况下不要勾：迁移负责建表，新环境没表会缺功能。
        # 只在「表早就存在、且 D1 配额打满导致连 wrangler migrations apply 都跑不动」时，
        # 用它把部署本身完成掉 —— 跳过的是重复的建表动作，不是数据迁移。
        description: '跳过 d1 迁移（默认关。仅在表已存在且 D1 配额打满时用）'
        type: boolean
        default: false

concurrency:
  group: workers-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PASSWORD: ${{ secrets.PASSWORD }}
      UUID: ${{ secrets.UUID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
      # GitHub 仓库 Variables.STORAGE_BACKEND 可选 kv，默认 d1（D1 为默认后端，部署前自动应用迁移）
      STORAGE_BACKEND: ${{ vars.STORAGE_BACKEND || 'd1' }}
      # 部署形态项：wrangler.toml 里是占位符，由 prepare-deploy.py 在部署前渲染。
      # 不配置也能跑 —— 缺哪个就调 Cloudflare 接口自动创建（D1 数据库 / KV 命名空间 / R2 桶）；
      # 想复用已有资源时才需要在这里填 ID。R2 建不出来会自动去掉绑定，不会卡住部署。
      WORKER_NAME: ${{ vars.WORKER_NAME }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
      KV_NAMESPACE_ID: ${{ vars.KV_NAMESPACE_ID }}
      R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
      # 健康检查链接：留空则按当前仓库地址自动生成（GITHUB_REPOSITORY 由 Actions 自带）
      GH_ACTIONS_URL: ${{ vars.GH_ACTIONS_URL }}
      # 优选 / 自愈的目标域名与派生配置全部来自仓库变量，不在代码里写死任何域名
      PROXY_HOST: ${{ vars.PROXY_HOST }}
      PREF_DOMAINS: ${{ vars.PREF_DOMAINS }}
      SUB_URL: ${{ vars.SUB_URL }}
      # 首页伪装的非敏感部分可走仓库变量，作为首次部署的种子（写入后以面板配置为准）。
      # 隐蔽入口路径 / URL 口令属于敏感信息，建议放在 Secrets 里（即下面的 DISGUISE_PATH / DISGUISE_TOKEN）。
      DISGUISE_TEMPLATE: ${{ vars.DISGUISE_TEMPLATE }}
      DISGUISE_TITLE: ${{ vars.DISGUISE_TITLE }}
      DISGUISE_SUBTITLE: ${{ vars.DISGUISE_SUBTITLE }}
      DISGUISE_CONTACT: ${{ vars.DISGUISE_CONTACT }}
      DISGUISE_PATH: ${{ secrets.DISGUISE_PATH }}
      DISGUISE_TOKEN: ${{ secrets.DISGUISE_TOKEN }}
      # 内存模式的种子：D1 / KV 配额打满时用它把数据灌回内存，让站点不依赖任何存储也能起来。
      # 单个环境变量上限 5 KB（付费计划同样是 5 KB），所以种子要分成若干段 ——
      # 用 node tools/export-seed.mjs --chunk 4096 导出，再按它给出的变量名依次填到仓库的
      # Variables 里（SEED_JSON、SEED_JSON_01、SEED_JSON_02 ……，最多 24 段约 120 KB）。
      # 部署脚本从这里拿完整变量清单、只挑出种子那几段 —— 所以新增分段不用改这个文件。
      # ⚠️ 只写进 /tmp 的文件，不往日志里打印（里面有站点配置）。
      REPO_VARS_JSON: ${{ toJSON(vars) }}
      # 只有「手动触发＋勾选 skip_migrations」才跳过 d1 迁移；push 触发这里恒为空（不跳过）。
      # 迁移的作用是建表；跳过它不等于跳过数据，表在配额打满前早就建好了。
      # 它能派上用场的唯一场景：配额打满时连 wrangler migrations apply 都跑不动，
      # 但 Worker 本身还想带着 d1 绑定重新部署上线。
      ANYPROXY_SKIP_MIGRATIONS: "${{ github.event.inputs.skip_migrations == 'true' && '1' || '' }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install wrangler (pinned)
        # 固定 wrangler 版本，避免 wrangler-action 内部 npx 动态下载被 CI 交互确认拦截
        run: npm install -g wrangler@3.114.0

      - name: Prepare config
        # 渲染 wrangler.toml 的占位符（缺的自动创建 Cloudflare 资源），并按 STORAGE_BACKEND
        # 裁剪绑定、d1 模式应用迁移；控制逻辑见 .github/scripts/prepare-deploy.py
        run: |
          # 仓库变量整份交给脚本，脚本自己挑种子那几段（新增分段不必改这里）。
          # 走文件而不是命令行参数：内容里有站点配置，不该出现在进程列表或日志里。
          printf '%s' "$REPO_VARS_JSON" > /tmp/repo-vars.json
          python3 .github/scripts/prepare-deploy.py
          rm -f /tmp/repo-vars.json
        env:
          REPO_VARS_FILE: /tmp/repo-vars.json

      - name: Deploy Worker
        # 非敏感配置用 --var 注入；缺失的变量不传（Worker 侧回退到请求 hostname / 面板配置，不会写到别人的域名上）
        run: |
          ARGS="--var STORAGE_BACKEND:$STORAGE_BACKEND"
          [ -n "$PROXY_HOST" ] && ARGS="$ARGS --var PROXY_HOST:$PROXY_HOST"
          [ -n "$PREF_DOMAINS" ] && ARGS="$ARGS --var PREF_DOMAINS:$PREF_DOMAINS"
          [ -n "$SUB_URL" ] && ARGS="$ARGS --var SUB_URL:$SUB_URL"
          [ -n "$DISGUISE_TEMPLATE" ] && ARGS="$ARGS --var DISGUISE_TEMPLATE:$DISGUISE_TEMPLATE"
          [ -n "$DISGUISE_TITLE" ] && ARGS="$ARGS --var DISGUISE_TITLE:$DISGUISE_TITLE"
          [ -n "$DISGUISE_SUBTITLE" ] && ARGS="$ARGS --var DISGUISE_SUBTITLE:$DISGUISE_SUBTITLE"
          [ -n "$DISGUISE_CONTACT" ] && ARGS="$ARGS --var DISGUISE_CONTACT:$DISGUISE_CONTACT"
          wrangler deploy $ARGS

      - name: Put secrets
        # 只写入非空的 Secret：缺哪个就跳过并提示，避免把空值写进 Worker 或让 CI 失败。
        # 缺少 CF_ZONE_ID / CF_API_TOKEN 不会阻断部署，只是「DNS 优选」会明确报错提示去配置。
        run: |
          set -e
          put_if_set() {
            if [ -n "$2" ]; then echo "$2" | wrangler secret put "$1";
            else echo "::warning::未配置 $1，已跳过注入（相关功能会明确提示去配置）"; fi
          }
          put_if_set PASSWORD "$PASSWORD"
          put_if_set UUID "$UUID"
          put_if_set CF_API_TOKEN "$CLOUDFLARE_API_TOKEN"
          put_if_set CF_ZONE_ID "$CF_ZONE_ID"
          # 伪装入口（路径 / 口令）走 Secret，不进 --var：它们会出现在 Actions 日志与 wrangler 输出里
          put_if_set DISGUISE_PATH "$DISGUISE_PATH"
          put_if_set DISGUISE_TOKEN "$DISGUISE_TOKEN"
