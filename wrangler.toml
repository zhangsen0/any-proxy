# Cloudflare Worker 配置文件（Any-Proxy 动态版）
#
# ## 这个文件里的 __XXX__ 是占位符，不是可以直接部署的值
#
# 以前这里写的是本项目账号下的 D1 / KV 资源 ID，fork 之后不改就部署失败 ——
# 而「知道要去改哪里」这件事本身就得先读一遍源码。现在改成占位符，部署前由
# .github/scripts/prepare-deploy.py 统一渲染：
#   - 仓库 Variables 里配了 → 用你配的值
#   - 没配 → 调 Cloudflare 接口自动创建（D1 数据库 / KV 命名空间 / R2 桶），拿了 ID 回填
#   - R2 建不出来（账号没开通）→ 直接去掉该绑定，Worker 自动降级为纯 Cache API
#   - 健康检查链接 → 按 GITHUB_REPOSITORY 拼成你自己仓库的地址
# 所以 fork 之后**不用改这个文件**，也不用去控制台抄 ID。
# 本地 `wrangler dev` 前先跑一次同一脚本（加 --local，用占位 ID，不碰云端资源）。
name = "__WORKER_NAME__"
main = "worker.js"
compatibility_date = "2025-01-01"

# 使用 Service Worker 语法（addEventListener）
workers_dev = true

# 不要开部署压缩（minify）。2026-09-18 试过一次：867 KB → 535 KB 看着划算，但压完线上
# 面板立刻「一直加载中 + 按钮全失灵」—— 压缩会重命名模块级标识符，而几处「写成本地函数、
# 再 toString() 注入浏览器」的前端脚本里还引用着它们，浏览器侧第一行就 ReferenceError，
# Worker 日志却一条都没有（详见 docs/07-踩坑记录.md 第 19 条）。
# 体积本来也不是瓶颈（867 KB 距 1 MiB 上限还有余量），为省体积冒这个险不值，已回滚。
# 顺带留下的好处：注入脚本一律用**实参**传数据，不再依赖全局名 —— 这条纪律照旧守。

# 定时任务：每 5 分钟触发一次检查；实际自动优选 DNS 按前端配置的间隔执行（默认 12 小时）
[triggers]
crons = ["*/5 * * * *"]

# 双绑定为模板：部署时由 GitHub Actions 按 STORAGE_BACKEND 裁剪，只保留使用的后端（d1 默认 / kv 可选）
# D1 为默认后端：kv 表由 migrations/0001_init.sql 建立，部署时自动应用
[[d1_databases]]
binding = "DB"
database_name = "any-proxy-db"
database_id = "__D1_DATABASE_ID__"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "SITES"
id = "__KV_NAMESPACE_ID__"

# 流媒体模式的分片持久缓存（R2）：Cache API 存不下的大分片（>4MB）与 206 分片
# 落 R2，命中即满速返回、零回源。对象带 media:ts 元数据，由 cron 定时清理过期项；
# 未绑定（本地测试/未配置）时自动降级为纯 Cache API 行为 —— 所以 R2 建不出来时
# 部署脚本会直接删掉这一段，而不是让部署失败。
[[r2_buckets]]
binding = "MEDIA_R2"
bucket_name = "__R2_BUCKET_NAME__"


# 可配置变量（非敏感）。全部可留空 —— Worker 侧均有「按请求推导或明确报错」的降级策略，
# 不会悄悄回退到任何写死的域名 / IP / IP 段。以上变量也可由 GitHub Actions 用 --var 注入（见 deploy-cloudflare.yml）。
[vars]
# 管理页「手动触发健康检查」跳转链接（部署脚本按仓库地址自动填；留空则主页不显示该按钮）
GH_ACTIONS_URL = "__GH_ACTIONS_URL__"
# PREF_DOMAINS    = "www.cloudflare.com speed.cloudflare.com"  # 候选域名池种子，优选用；留空则由面板填写
# CF_IP_RANGES    = "104.16.0.0/13 172.64.0.0/13"              # 自定义边缘 IP 段；留空则运行时拉取官方列表并缓存
# CF_IP_RANGES_URL = "https://api.cloudflare.com/client/v4/ips" # 边缘 IP 段数据源，可换成自建镜像
# DOH_URL         = "https://cloudflare-dns.com/dns-query"      # 解析候选域名用的 DoH 服务
# DNS_BUDGET_MS   = "22000"                                      # 单次优选的总时间预算（须小于 Workers 30s 墙钟）
#
# ---- 首页伪装（详见 README「首页伪装」章节）----
# 面板里配置更直观：管理页 → 首页伪装。以下变量只作为「首次部署的种子」，
# 一旦写入过面板配置就以面板为准。敏感项（隐蔽路径 / URL 口令）建议走 Actions Secrets，
# 避免出现在本文件的版本库里。
# DISGUISE_CONFIG   = '{"enabled":true,"template":"maintenance","title":"示例站点"}'  # 整段配置（JSON）
# DISGUISE_TEMPLATE = "maintenance"     # maintenance / corp / blog / download / custom
# DISGUISE_TITLE    = ""                # 站点标题，留空则用当前域名
# DISGUISE_SUBTITLE = ""                # 副标题，留空则不显示该区块
# DISGUISE_CONTACT  = ""                # 页脚联系方式
# DISGUISE_STRICT   = "true"            # 严格模式：未登录拿不到任何 API 数据（推荐）
# DISGUISE_PATH     = ""                # 隐蔽入口路径，如 /mypanel（不能以 admin/edt/p/sub 等保留段开头）

# 可选：设置自定义域名（需要先在 Cloudflare 配置）
# routes = [
#   { pattern = "your-domain.com/*", zone_name = "your-domain.com" }
# ]
